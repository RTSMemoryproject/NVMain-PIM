# 跨層級協同設計：RT-BPIM 架構下「近埠填充策略」之技術原理與模擬驗證

**報告主旨**：針對原論文在 RTM-PIM 架構中提出的三種組態 (`BaselineCPU`, `BucketCPU`, `BucketPIM`)，分析其在延遲與能耗上之折衷關係 (Trade-off)，並提出結合「近埠填充策略 (Near-Port Padding, NPP)」之優化架構，同時提供 NVMain 模擬器之量化數據對比。

---

## 1. 原論文三大架構之移位成本分析

原論文為降低 RTM 的移位成本，設計了三種遞進之硬體架構。在評估系統總動態能耗時，區分「運算能耗 (Operation Energy)」與「移位能耗 (Shift Energy)」至關重要。

1. **`BaselineCPU` (DBC = 32 bits)**
   - **移位行為**：因資料匯流排寬度限制，除初始對齊移位外，讀取 512 bits 之 Bucket 需在內部進行 15 次連環移位 (Sequential Shifts)。
2. **`BucketCPU` 與 `BucketPIM` (DBC = 512 bits)**
   - **移位行為**：透過將物理軌道擴充 16 倍，此二架構免除了內部連環移位，僅需執行 1 次初始對齊移位。兩者在記憶體端之移位行為與移位能耗完全相同。
   - **總能耗差異**：`BucketPIM` 透過 PIM 達成平行計算，但其寫入 (Write) 與橫向讀取 (TR) 之運算能耗較高，導致總動態能耗約為 `BucketCPU` 的 1.4 倍。

### 1.1 原架構之移位能耗瓶頸 (Shift Energy Penalty)
從 `BaselineCPU` 升級至 `BucketPIM` (擴寬軌道至 512 bits) 雖大幅降低了存取延遲，但移位能耗顯著上升。排除 PIM 運算開銷，系統在執行初始移位時需同時驅動 512 條奈米線，導致動態移位電流與總移位能耗大幅增加。

---

## 2. 提出架構：`BucketPIM + Near-Port Padding`

為改善 `BucketPIM` 之移位能耗瓶頸，本研究提出結合硬體架構與軟體層資料佈局 (Data Layout) 之協同設計。

### 2.1 技術原理 (近埠填充策略, NPP)
此策略修改記憶體之空間配置邏輯，將遠離存取埠的磁疇配置為無效區域 (Padding)，限制 FM-index Bucket 僅能存放於距離實體存取埠 $D_{max}$（例如 8 步）以內之區間。
透過犧牲部分儲存容量（約 60%），此策略有效最小化初始尋址之實體距離，進而降低大規模軌道移位所需之動態能耗。

---

## 3. NVMain 模擬器數據驗證

本研究於 NVMain 模擬器中執行 500 次隨機 FM-index Bucket (512-bit) 讀取操作，以驗證上述架構。

### 3.1 物理單元成本基準 (校準自原論文 Table 2)

| 基礎操作 (Operation) | 移位 (Shift) | 讀取 (Read) | 寫入 (Write) | 橫向讀取 (TR) |
| :--- | :---: | :---: | :---: | :---: |
| **物理延遲 (Latency)** | 2.14 ns | 1.61 ns | 4.84 ns | 5.00 ns |
| **物理能耗 (Energy)** | 0.019 nJ (32-track) | 0.080 nJ | 0.108 nJ | 0.175 nJ |

### 3.2 測量指標定義
* **移位延遲 (Latency)**：以「物理磁疇移動步數 (Steps / Read)」及對應的「奈秒時延 (ns / Read, 步數 × 2.14 ns)」為量化指標。
* **動態移位能耗 (Shift Energy)**：以「軌道位移總數 (Track-Shifts / Read)」及「實體移位能耗 (nJ / Read)」為量化指標。
  - 計算方式：Track-Shifts = 移動步數 × 軌道寬度；實體移位能耗 = (Track-Shifts / 32) × 0.019 nJ。

### 3.3 實驗數據總結表

| 模擬架構對應 | 軌道寬度 (DBC) | 移位步數 (Steps / Read) | 移位時延 (ns) | 動態位移總數 (Track-Shifts) | 實體移位能耗 (nJ / Read) |
| :--- | :---: | :---: | :---: | :---: | :---: |
| **1. `BaselineCPU`** (傳統基準) | 32 bits | 21.9 (初始) + 15 (連環) = **36.9 步** | **78.97 ns** | (21.9 × 32) + (15 × 32) = **1,182** | **0.702 nJ** |
| **2. `BucketPIM` / `BucketCPU`** (原論文最佳解) | 512 bits | 21.9 (初始) + 0 (連環) = **21.9 步** | **46.87 ns** | 21.9 × 512 = **11,237** | **6.672 nJ** |
| **3. `BucketPIM + Near-Port Padding`** (本研究提出) | 512 bits | 10.7 (受限初始) + 0 (連環) = **10.7 步** | **22.90 ns** | 10.7 × 512 = **5,480** | **3.254 nJ** |

> [!NOTE]
> *註 1：原論文之 `BucketCPU` 與 `BucketPIM` 於動態移位能耗上具備相同之物理行為，故共用模擬數據。*
> *註 2：本研究方案之模擬數據受限於多讀寫頭鉗制邏輯，理論上移位延遲可進一步降低。*
---
## 4. 數據分析與研究貢獻

### 4.1 軌道擴展之移位能耗代價
模擬數據指出，`BucketPIM` 雖將移位延遲從 36.9 步 (78.97 ns) 降至 21.9 步 (46.87 ns)（降低約 40.6%），但動態移位能耗從 1,182 Track-Shifts (0.702 nJ) 劇烈上升至 11,237 Track-Shifts (6.672 nJ)（增加約 9.5 倍）。此數據僅反映推動 512 條軌道之物理代價，未計入 Write (0.108 nJ) 與 TR (0.175 nJ) 運算能耗，印證了原論文中軌道擴寬在消除連環移位的同時，衍生了高達近十倍的移位功耗開銷。

### 4.2 近埠填充策略 (NPP) 之效益
結合 NPP 策略後，系統展現以下改善：
1. **降低移位延遲**：將 512 條奈米線之平均移動距離從 21.9 步壓縮至 10.7 步（實體移位時延僅 22.90 ns），相較於 `BaselineCPU` (78.97 ns)，移位延遲降低高達 **71.0%**。
2. **大幅改善移位能耗**：將 `BucketPIM` 之動態移位能耗從 11,237 Track-Shifts (6.672 nJ) 降低至 5,480 Track-Shifts (3.254 nJ)（**減少約 51.2%**），成功克服原論文遺留之移位功耗瓶頸，為後續之 PIM 運算提供更充裕之功耗容裕度 (Power Budget)。

---

## 5. 使用場景適配解析 (Scenario Suitability Analysis)

近埠填充策略 (NPP) 透過空間換取能耗與延遲之設計，具備特定之應用適配性：

#### 5.1 適用場景：資料中心級別之基因定序
* **Write-Once-Read-Many (WORM) 負載**：FM-index 具備單次建構、多次查詢之特性。NPP 之靜態排版成本僅發生於寫入階段，後續查詢皆可受益於低移位延遲。
* **高隨機存取 (Random Access)**：針對 FM-index 之不規律存取模式，NPP 透過限制最大移位距離，有效降低隨機跳躍之移位代價。
* **能耗導向之伺服器環境**：在資料中心環境中，以擴充非揮發性記憶體容量來換取系統整體能耗之降低，在總體擁有成本 (TCO) 上具備可行性。

#### 5.2 限制與挑戰：邊緣設備與動態寫入
* **高頻動態寫入**：於頻繁寫入之資料庫場景中，維持 NPP 之 $D_{max}$ 邊界將增加作業系統之空間管理複雜度
* **容量受限設備**：對於成本與體積受限之終端設備 (Edge IoT)，大幅犧牲儲存容量之策略不具實用性。
* **高空間局部性 (Spatial Locality) 負載**：針對循序讀取之應用，傳統 32-bit DBC 搭配連環移位架構即可達成高能源效率，無需採用 NPP。

### 6. 總結
原論文受限於硬體設計視角，需妥協於軌道擴展帶來之能耗增加。本研究引入軟體資料佈局，透過犧牲部分儲存容量作為 Padding，可有效彌補硬體軌道擴寬之能耗缺陷。
